<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Base Squircle Drop Shadow -->
    <filter id="base-shadow-light" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>

    <!-- App Tile Drop Shadow -->
    <filter id="tile-shadow-light" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Light Mode Base Gradients -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F2F3F7" />
      <stop offset="100%" stop-color="#D8DBE2" />
    </linearGradient>

    <linearGradient id="border-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#B8BCC6" stop-opacity="0.7" />
    </linearGradient>

    <!-- 3x3 Mini App Tile Gradients -->
    <!-- Row 1: Blue, Green, Pink -->
    <linearGradient id="tile-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48B8FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="tile-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5CF277" />
      <stop offset="100%" stop-color="#22C543" />
    </linearGradient>
    <linearGradient id="tile-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9D" />
      <stop offset="100%" stop-color="#FF2968" />
    </linearGradient>

    <!-- Row 2: Orange, Purple, Cyan -->
    <linearGradient id="tile-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFBD3B" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>
    <linearGradient id="tile-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C87CFF" />
      <stop offset="100%" stop-color="#8F38EB" />
    </linearGradient>
    <linearGradient id="tile-6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5CE6FF" />
      <stop offset="100%" stop-color="#00A6E8" />
    </linearGradient>

    <!-- Row 3: Red-Orange, Yellow, Indigo -->
    <linearGradient id="tile-7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF735C" />
      <stop offset="100%" stop-color="#F23022" />
    </linearGradient>
    <linearGradient id="tile-8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE64D" />
      <stop offset="100%" stop-color="#F5B800" />
    </linearGradient>
    <linearGradient id="tile-9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B88FF" />
      <stop offset="100%" stop-color="#4A4AE8" />
    </linearGradient>

    <!-- Tile Inner Top Highlight -->
    <linearGradient id="tile-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Main macOS Squircle Base -->
  <rect x="44" y="44" width="424" height="424" rx="96" ry="96" fill="url(#bg-light)" stroke="url(#border-light)" stroke-width="3" filter="url(#base-shadow-light)" />

  <!-- 3x3 App Icon Grid -->
  <g filter="url(#tile-shadow-light)">
    <!-- Row 1 -->
    <rect x="114" y="114" width="76" height="76" rx="18" fill="url(#tile-1)" />
    <rect x="114" y="114" width="76" height="76" rx="18" fill="url(#tile-gloss)" />

    <rect x="218" y="114" width="76" height="76" rx="18" fill="url(#tile-2)" />
    <rect x="218" y="114" width="76" height="76" rx="18" fill="url(#tile-gloss)" />

    <rect x="322" y="114" width="76" height="76" rx="18" fill="url(#tile-3)" />
    <rect x="322" y="114" width="76" height="76" rx="18" fill="url(#tile-gloss)" />

    <!-- Row 2 -->
    <rect x="114" y="218" width="76" height="76" rx="18" fill="url(#tile-4)" />
    <rect x="114" y="218" width="76" height="76" rx="18" fill="url(#tile-gloss)" />

    <rect x="218" y="218" width="76" height="76" rx="18" fill="url(#tile-5)" />
    <rect x="218" y="218" width="76" height="76" rx="18" fill="url(#tile-gloss)" />

    <rect x="322" y="218" width="76" height="76" rx="18" fill="url(#tile-6)" />
    <rect x="322" y="218" width="76" height="76" rx="18" fill="url(#tile-gloss)" />

    <!-- Row 3 -->
    <rect x="114" y="322" width="76" height="76" rx="18" fill="url(#tile-7)" />
    <rect x="114" y="322" width="76" height="76" rx="18" fill="url(#tile-gloss)" />

    <rect x="218" y="322" width="76" height="76" rx="18" fill="url(#tile-8)" />
    <rect x="218" y="322" width="76" height="76" rx="18" fill="url(#tile-gloss)" />

    <rect x="322" y="322" width="76" height="76" rx="18" fill="url(#tile-9)" />
    <rect x="322" y="322" width="76" height="76" rx="18" fill="url(#tile-gloss)" />
  </g>
</svg>
