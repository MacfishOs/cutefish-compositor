<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Base Squircle Drop Shadow -->
    <filter id="base-shadow-dark" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- App Tile Drop Shadow -->
    <filter id="tile-shadow-dark" x="-25%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="0" dy="6" stdDeviation="5.5" flood-color="#000000" flood-opacity="0.48" />
    </filter>

    <!-- Dark Mode Base Gradients -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3C42" />
      <stop offset="45%" stop-color="#242529" />
      <stop offset="100%" stop-color="#141517" />
    </linearGradient>

    <linearGradient id="border-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#686B75" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#3A3C42" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0D0E10" stop-opacity="0.9" />
    </linearGradient>

    <!-- 3x3 Mini App Tile Gradients -->
    <!-- Row 1: Blue, Green, Pink -->
    <linearGradient id="d-tile-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52C0FF" />
      <stop offset="100%" stop-color="#0A70FF" />
    </linearGradient>
    <linearGradient id="d-tile-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60F77C" />
      <stop offset="100%" stop-color="#20CA42" />
    </linearGradient>
    <linearGradient id="d-tile-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF73A3" />
      <stop offset="100%" stop-color="#FF2E6E" />
    </linearGradient>

    <!-- Row 2: Orange, Purple, Cyan -->
    <linearGradient id="d-tile-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC447" />
      <stop offset="100%" stop-color="#FF8C05" />
    </linearGradient>
    <linearGradient id="d-tile-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D188FF" />
      <stop offset="100%" stop-color="#963DF2" />
    </linearGradient>
    <linearGradient id="d-tile-6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66EAFF" />
      <stop offset="100%" stop-color="#05AEEB" />
    </linearGradient>

    <!-- Row 3: Red-Orange, Yellow, Indigo -->
    <linearGradient id="d-tile-7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7D66" />
      <stop offset="100%" stop-color="#F73628" />
    </linearGradient>
    <linearGradient id="d-tile-8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEB57" />
      <stop offset="100%" stop-color="#FABE05" />
    </linearGradient>
    <linearGradient id="d-tile-9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8591FF" />
      <stop offset="100%" stop-color="#5252F0" />
    </linearGradient>

    <!-- Tile Inner Rim Highlight -->
    <linearGradient id="d-tile-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Main macOS Squircle Base -->
  <rect x="44" y="44" width="424" height="424" rx="96" ry="96" fill="url(#bg-dark)" stroke="url(#border-dark)" stroke-width="3" filter="url(#base-shadow-dark)" />

  <!-- 3x3 App Icon Grid -->
  <g filter="url(#tile-shadow-dark)">
    <!-- Row 1 -->
    <rect x="114" y="114" width="76" height="76" rx="18" fill="url(#d-tile-1)" />
    <rect x="114" y="114" width="76" height="76" rx="18" fill="url(#d-tile-gloss)" />

    <rect x="218" y="114" width="76" height="76" rx="18" fill="url(#d-tile-2)" />
    <rect x="218" y="114" width="76" height="76" rx="18" fill="url(#d-tile-gloss)" />

    <rect x="322" y="114" width="76" height="76" rx="18" fill="url(#d-tile-3)" />
    <rect x="322" y="114" width="76" height="76" rx="18" fill="url(#d-tile-gloss)" />

    <!-- Row 2 -->
    <rect x="114" y="218" width="76" height="76" rx="18" fill="url(#d-tile-4)" />
    <rect x="114" y="218" width="76" height="76" rx="18" fill="url(#d-tile-gloss)" />

    <rect x="218" y="218" width="76" height="76" rx="18" fill="url(#d-tile-5)" />
    <rect x="218" y="218" width="76" height="76" rx="18" fill="url(#d-tile-gloss)" />

    <rect x="322" y="218" width="76" height="76" rx="18" fill="url(#d-tile-6)" />
    <rect x="322" y="218" width="76" height="76" rx="18" fill="url(#d-tile-gloss)" />

    <!-- Row 3 -->
    <rect x="114" y="322" width="76" height="76" rx="18" fill="url(#d-tile-7)" />
    <rect x="114" y="322" width="76" height="76" rx="18" fill="url(#d-tile-gloss)" />

    <rect x="218" y="322" width="76" height="76" rx="18" fill="url(#d-tile-8)" />
    <rect x="218" y="322" width="76" height="76" rx="18" fill="url(#d-tile-gloss)" />

    <rect x="322" y="322" width="76" height="76" rx="18" fill="url(#d-tile-9)" />
    <rect x="322" y="322" width="76" height="76" rx="18" fill="url(#d-tile-gloss)" />
  </g>
</svg>
